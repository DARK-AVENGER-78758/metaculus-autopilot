name: Watch Polymarket markets

# Watches Polymarket markets, forecasts them, keeps score and guides the owner on their bets.
# It reads public data only: the bot has no account there and places no bets. How often a
# market is looked at depends on how soon it closes. See markets.py and AUTOPILOT.md.
on:
  workflow_dispatch:
    inputs:
      forecasts:
        description: "Most forecasts to make in this run (each takes about ten minutes)"
        default: "4"
      check:
        description: "Only check that outcomes can be read from Polymarket"
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *" # hourly; a market closing soon is looked at every time, a distant one twice a day

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write # only for the keep-alive step at the end
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      # The owner's bets, the bot's record and its alerts live in their private "market-alerts"
      # repository, never here: this repository's logs are public. ALERTS_KEY is a deploy key
      # that can reach that one repository only.
      - name: Fetch the private notes
        env:
          ALERTS_KEY: ${{ secrets.ALERTS_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/alerts_key"
          printf '%s\n' "$ALERTS_KEY" > "$RUNNER_TEMP/alerts_key"
          echo "GIT_SSH_COMMAND=ssh -i $RUNNER_TEMP/alerts_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/alerts_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 "git@github.com:${{ github.repository_owner }}/market-alerts.git" private
      # Hooks, seen headlines, forecast times and last-told prices live in state/. It is a
      # cache: if it is lost the bot rebuilds it, at the cost of one more forecast per market.
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: market-state-${{ github.run_id }}
          restore-keys: market-state-
      - name: Watch
        run: uv run python markets.py ${{ inputs.check && '--settle-check' || '' }}
        env:
          PRIVATE_DIR: private
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }} # free key from build.nvidia.com
          AUTO_MARKETS: ${{ vars.AUTO_MARKETS }} # busiest markets closing in 3 to 90 days (default 6, 0 for none)
          NEAR_MARKETS: ${{ vars.NEAR_MARKETS }} # busiest markets closing within 3 days (default 6, 0 for none)
          PRICE_MOVE: ${{ vars.PRICE_MOVE }} # a price change worth an alert (default 0.1)
          MAX_FORECASTS_PER_RUN: ${{ inputs.forecasts || vars.MAX_FORECASTS_PER_RUN || 4 }} # four fit well inside the time limit
          FORECAST_MODELS: ${{ vars.FORECAST_MODELS }}
          UTILITY_MODELS: ${{ vars.UTILITY_MODELS }}
          REQUESTS_PER_MINUTE: ${{ vars.REQUESTS_PER_MINUTE }}
          FORECAST_SAMPLES: ${{ vars.FORECAST_SAMPLES }}
      # A workflow in the private repository files each new alert as an issue, and GitHub
      # notifies the owner. Nothing is printed here.
      - name: Save the private notes
        if: always() # a run that ends red has still made forecasts worth telling
        run: |
          cd private
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="market watch" -c user.email="market-watch@users.noreply.github.com" commit -q -m "Market watch"
          git pull -q --rebase # the owner may have edited watch.txt meanwhile
          git push -q
      - name: Save bot state
        if: always()
        continue-on-error: true # losing the cache only costs a rebuild
        uses: actions/cache/save@v4
        with:
          path: state
          key: market-state-${{ github.run_id }}
      # GitHub switches off scheduled workflows after 60 days without repository activity.
      # Re-enabling this one through the API resets that clock.
      - name: Keep this schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch_markets.yaml/enable"
